<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Crawl Site · Вход</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-card">
        <h1>🔐 Login</h1>
        <p>Please log in to access protected pages</p>
        <form id="loginForm">
            <div>
                <label>Username</label>
                <input type="text" id="usernameInput" placeholder="admin" value="admin" />
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" value="1234" />
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p>⚡ demo: admin / 1234</p>
        <a href="/">← Back to main</a>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var user = document.getElementById('usernameInput').value.trim();
            var pass = document.getElementById('passwordInput').value.trim();
            if (user === 'admin' && pass === '1234') {
                window.location.href = '/dashboard';
            } else {
                alert('Invalid username or password');
            }
        });
    </script>
</body>
</html>
