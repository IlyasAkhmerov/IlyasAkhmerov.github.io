<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перенаправление</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f5fa 0%, #dce7f0 100%);
        }
        .loader {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #2a7fbd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            if (path !== '/' && !path.match(/\.[a-zA-Z0-9]+$/)) {
                var redirectUrl = '/' + path.slice(1) + search + hash;
                window.location.replace('/?redirect=' + encodeURIComponent(redirectUrl));
            }
        })();
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #476c84;">Перенаправление...</p>
    </div>
</body>
</html>
